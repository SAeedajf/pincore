name: Package Manager Unit Tests

on:
  push:
    paths:
      - 'Component/PackageManager/**'
      - 'tests/Unit/Component/PackageManager/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/package-manager-tests.yml'
  pull_request:
    paths:
      - 'Component/PackageManager/**'
      - 'tests/Unit/Component/PackageManager/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/package-manager-tests.yml'

permissions:
  contents: read

jobs:
  unit:
    name: PHP 8.2 unit suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit tests
        run: php vendor/bin/pest --configuration=phpunit.xml --testsuite=Unit

      - name: Validate PHP source files
        run: find Component/PackageManager tests/Unit/Component/PackageManager -name '*.php' -print0 | xargs -0 -n1 php -l
